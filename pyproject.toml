[project]
name = "post-training-labs"
version = "0.1.0"
description = "Hands-on labs for the LLM post-training curriculum"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "transformers>=4.46,<5",
    "accelerate>=1.0",
]

[tool.uv]
package = false

# cu121 wheels on Linux (LONI); the default PyPI wheel elsewhere
[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
